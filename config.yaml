# Vettercode config - defaults declared at top
defaults:
  github_username: pbulsink
  lmstudio_base_url: http://localhost:1234/v1
  lmstudio_model: local-model-id
  agent_mode: pr-draft  # observe | comment | pr-draft
  max_issues_per_night: 50
  start_time: "20:00"
  stop_time: "06:00"
  timezone: America/Toronto
  pr_branch_prefix: "vettercode/"
  log_file: "vettercode.log"

# Overrides, optional
github_username: null
lmstudio_model: null
agent_mode: null

# Policy
policy:
  respect_agents_md: true
  fallback_skills_path: ~/Documents/GitHub/skills

# State
state_db: "state.db"
