[project]
name = "vettercode"
version = "0.1.0"
description = "Nightly GitHub issue agent: LM Studio models + mini-swe-agent, opens draft PRs but never merges"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "pbulsink" }]
keywords = ["github", "agent", "lmstudio", "issues", "pull-requests"]
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
    "mini-swe-agent>=2.0",
    # litellm 1.98+ imports `NotRequired` from `typing` (3.11+); pin below to keep
    # Python 3.10 working. Bump once a stable release includes the fix (see
    # https://github.com/BerriAI/litellm/issues/38892).
    "litellm<1.98",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "responses>=0.25",
]

[project.scripts]
vettercode = "vettercode.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vettercode"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["vettercode"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
